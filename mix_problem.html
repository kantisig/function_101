        { q: 'ฟังก์ชัน $f = \\{(1,a), (2,b), (3,a)\\}$ เป็นฟังก์ชัน 1-1 หรือไม่', c1: 'ไม่เป็นฟังก์ชัน 1-1', c2: 'เป็นฟังก์ชัน 1-1', c3: 'ไม่เป็นฟังก์ชันตั้งแต่แรก', c4: 'เป็นความสัมพันธ์ผกผัน', ans: 'ไม่เป็นฟังก์ชัน 1-1', reason: 'มีสมาชิกเรนจ์ตัวหลังคือ $a$ ถูกใช้ซ้ำจับคู่กับทั้งเลข 1 และเลข 3 จึงไม่ใช่การจับคู่แบบหนึ่งต่อหนึ่ง' },
        { q: 'ฟังก์ชันกำลังสอง $f(x) = x^2$ บนโดเมนจำนวนจริงทั้งหมด ไม่เป็นฟังก์ชัน 1-1 เพราะเหตุใด', c1: 'เพราะมี $x$ สองค่า (เช่น $2$ และ $-2$) ที่ให้ค่า $y=4$ เหมือนกัน', c2: 'เพราะกราฟไม่ตัดแกน X', c3: 'เพราะโดเมนเป็นเซตอนันต์', c4: 'เพราะไม่มีค่าผกผันที่ตำแหน่ง 0', ans: 'เพราะมี $x$ สองค่า (เช่น $2$ และ $-2$) ที่ให้ค่า $y=4$ เหมือนกัน', reason: 'การที่ค่าผลลัพธ์ $y$ ตัวเดียวกันเกิดจากตัวแปรต้น $x$ ต่างกัน ขัดแย้งกับนิยามฟังก์ชัน 1-1' },
        { q: 'ถ้ากำหนดอสมการตรวจสอบฟังก์ชัน 1-1 ว่า "ถ้า $f(x_1) = f(x_2)$ แล้วต้องสรุปได้ว่า..." ควรเติมข้อความใดในช่องว่าง', c1: '$x_1 = x_2$', c2: '$x_1 \\ne x_2$', c3: '$x_1 = -x_2$', c4: '$x_1 \\cdot x_2 = 1$', ans: '$x_1 = x_2$', reason: 'นี่คือบทนิยามเชิงพีชคณิตของฟังก์ชัน 1-1 เพื่อพิสูจน์ว่าค่า $y$ เท่ากันต้องมาจาก $x$ ตัวเดียวกันเท่านั้น' },
        { q: 'ฟังก์ชันใดต่อไปนี้จัดเป็นฟังก์ชัน 1-1', c1: '$f(x) = x^3$', c2: '$f(x) = x^2$', c3: '$f(x) = |x-1|$', c4: '$f(x) = 7$', ans: '$f(x) = x^3$', reason: 'ฟังก์ชันกำลังสามเป็นฟังก์ชันเพิ่มขึ้นตลอดแนว เส้นตรงแนวนอนตัดกราฟเพียงจุดเดียวเสมอ' },
        { q: 'กำหนดโดเมนเฉพาะช่วง $A = [0, \\infty)$ ฟังก์ชันใดในข้อนี้จะเป็นฟังก์ชัน 1-1 บนเซต $A$', c1: '$f(x) = x^2$', c2: '$f(x) = \\sin(x)$', c3: '$f(x) = x^2 - 2x$', c4: '$f(x) = 4$', ans: '$f(x) = x^2$', reason: 'เมื่อตีกรอบพิจารณาเฉพาะ $x \\ge 0$ กราฟพาราโบลาซีกขวาจะมีลักษณะเพิ่มขึ้นทางเดียว จึงกลายเป็นฟังก์ชัน 1-1' },
        { q: 'ฟังก์ชันแบบขั้นบันไดหรือฟังก์ชันคงตัว เช่น $f(x) = 2$ เป็นฟังก์ชัน 1-1 หรือไม่', c1: 'ไม่เป็นฟังก์ชัน 1-1', c2: 'เป็นฟังก์ชัน 1-1', c3: 'เป็นฟังก์ชัน 1-1 เมื่อ $x$ เป็นจำนวนเต็ม', c4: 'ข้อมูลไม่เพียงพอในการระบุ', ans: 'ไม่เป็นฟังก์ชัน 1-1', reason: 'เนื่องจากทุกค่าของ $x$ ส่งไปหาเลข 2 ตัวเดียวทั้งหมด เป็นการจับคู่แบบกลุ่มสู่หนึ่ง (Many-to-One)' },
        { q: 'สัญลักษณ์ในข้อใดแทนคำว่า "ฟังก์ชันหนึ่งต่อหนึ่ง"', c1: '$f : A \\xrightarrow{1-1} B$', c2: '$f : A \\xrightarrow{\\text{onto}} B$', c3: '$f : A \\to B$', c4: '$f^{-1} : B \\to A$', ans: '$f : A \\xrightarrow{1-1} B$', reason: 'สัญลักษณ์ระบุความสัมพันธ์ 1-1 มักเขียนกำกับด้วยเลข 1-1 เหนือลูกศรนำทางจากเซตโดเมนไปเรนจ์' },
        { q: 'กำหนด $f(x) = e^x$ (ฟังก์ชันเอกซ์โพเนนเชียล) ข้อใดกล่าวถูกต้องเกี่ยวกับการเป็นฟังก์ชัน 1-1', c1: 'เป็นฟังก์ชัน 1-1 เพราะกราฟเพิ่มขึ้นตลอดแนวและไม่วนกลับซ้ำ', c2: 'ไม่เป็นฟังก์ชัน 1-1 เพราะค่าติดลบไม่ได้', c3: 'ไม่เป็นฟังก์ชัน 1-1 เพราะตัดแกน Y', c4: 'เป็นฟังก์ชันคู่', ans: 'เป็นฟังก์ชัน 1-1 เพราะกราฟเพิ่มขึ้นตลอดแนวและไม่วนกลับซ้ำ', reason: 'กราฟของเอกซ์โพเนนเชียลผ่านการทดสอบเส้นแนวนอน เนื่องจากเป็นฟังก์ชันเพิ่มทางเดียวแบบ Monotonic' },
        { q: 'กราฟข้อใดต่อไปนี้ผ่านการตรวจสอบและจัดเป็นฟังก์ชัน 1-1', c1: 'กราฟเส้นตรงเอียงซ้าย $y = -2x + 3$', c2: 'กราฟพาราโบลาคว่ำ', c3: 'กราฟรูปคลื่นไซน์', c4: 'กราฟวงรี', ans: 'กราฟเส้นตรงเอียงซ้าย $y = -2x + 3$', reason: 'เส้นตรงที่เอียงมีความชันคงที่ เส้นแนวนอนลากผ่านจุดใดๆ ก็จะตัดกราฟเพียงจุดเดียวเสมอ' },
        { q: 'ถ้าฟังก์ชัน $f$ ไม่เป็นฟังก์ชัน 1-1 จะส่งผลโดยตรงต่อสิ่งใด', c1: 'ฟังก์ชันผกผันจะไม่เป็นฟังก์ชัน', c2: 'หาโดเมนไม่ได้', c3: 'ไม่สามารถหาคอมโพสิทได้', c4: 'กราฟจะกลายเป็นเส้นตรง', ans: 'ฟังก์ชันผกผันจะไม่เป็นฟังก์ชัน', reason: 'ถ้าตัวหลังซ้ำ เมื่อสลับสมาชิกลูกศรย้อนกลับ ตัวหน้าของฟังก์ชันผกผันจะแตกกิ่งซ้ำ ทำให้ไม่ผ่านนิยามการเป็นฟังก์ชัน' },
        { q: 'กำหนด $f = \\{(x,y) \\in \\mathbb{R}\\times\\mathbb{R} \\mid y = x|x|\\}$ ฟังก์ชันนี้เป็นฟังก์ชัน 1-1 หรือไม่', c1: 'เป็นฟังก์ชัน 1-1', c2: 'ไม่เป็นฟังก์ชัน 1-1', c3: 'ไม่เป็นฟังก์ชัน', c4: 'เป็นฟังก์ชันคงตัว', ans: 'เป็นฟังก์ชัน 1-1', reason: 'เมื่อแยกกรณี $x \\ge 0 \\Rightarrow y=x^2$ และ $x < 0 \\Rightarrow y=-x^2$ กราฟจะเพิ่มขึ้นทางเดียวตลอดสาย จึงเป็นฟังก์ชัน 1-1' },
        { q: 'ข้อใดไม่ใช่คุณสมบัติของฟังก์ชัน 1-1', c1: 'ค่า $y$ หนึ่งค่าสามารถจับคู่กับค่า $x$ ได้หลายค่า', c2: 'ถ้า $x_1 \\ne x_2$ แล้ว $f(x_1) \\ne f(x_2)$', c3: 'กราฟผ่านการตรวจสอบด้วยเส้นแนวนอน', c4: 'สามารถหาฟังก์ชันอินเวอร์สที่เป็นฟังก์ชันได้', ans: 'ค่า $y$ หนึ่งค่าสามารถจับคู่กับค่า $x$ ได้หลายค่า', reason: 'ข้อนี้เป็นคำอธิบายของฟังก์ชันแบบ Many-to-One ซึ่งขัดแย้งกับคำจำกัดความของหนึ่งต่อหนึ่งโดยตรง' },
        { q: 'กำหนดให้ $f(x) = \\frac{1}{x}$ บนโดเมน $\\mathbb{R}-\\{0\\}$ ฟังก์ชันนี้เป็นฟังก์ชัน 1-1 หรือไม่', c1: 'เป็นฟังก์ชัน 1-1', c2: 'ไม่เป็นฟังก์ชัน 1-1', c3: 'ไม่เป็นฟังก์ชัน', c4: 'เป็นฟังก์ชันคาบ', ans: 'เป็นฟังก์ชัน 1-1', reason: 'ถ้า $\\frac{1}{x_1} = \\frac{1}{x_2}$ พลิกเศษส่วนกลับจะได้ $x_1 = x_2$ ทันที แสดงว่าเป็นแบบ 1-1' },

        // หมวด 5: ฟังก์ชันทั่วถึง (Onto Function) (ข้อ 61-75)
        { q: 'ฟังก์ชัน $f : A \\to B$ จะจัดเป็นฟังก์ชันทั่วถึง (Onto) เมื่อเงื่อนไขใดเป็นจริง', c1: 'เรนจ์ของ $f$ เท่ากับเซต $B$ พอดี', c2: 'เรนจ์ของ $f$ เป็นสับเซตแท้ของเซต $B$', c3: 'โดเมนของ $f$ เท่ากับเซต $B$', c4: 'เซต $A$ เท่ากับเซต $B$', ans: 'เรนจ์ของ $f$ เท่ากับเซต $B$ พอดี', reason: 'นิยามของฟังก์ชันทั่วถึง (Surjective) คือ สมาชิกทุกตัวในเซตปลายทาง $B$ ต้องถูกจับคู่จนครบถ้วน ($R_f = B$)' },
        { q: 'กำหนดให้ $A = \\{1, 2\\}$ และ $B = \\{3, 4\\}$ ฟังก์ชันใดต่อไปนี้เป็นฟังก์ชันจาก $A$ "ทั่วถึง" $B$', c1: '$f = \\{(1,3), (2,4)\\}$', c2: '$f = \\{(1,3), (2,3)\\}$', c3: '$f = \\{(1,4), (2,4)\\}$', c4: '$f = \\{(3,1), (4,2)\\}$', ans: '$f = \\{(1,3), (2,4)\\}$', reason: 'เรนจ์ของฟังก์ชันในข้อ 1 คือ $\\s{3,4}$ ซึ่งใช้สมาชิกครบทุกตัวของเซตปลายทาง $B$ พอดี' },
        { q: 'สัญลักษณ์ใดที่ใช้แสดงโครงสร้างความเป็น "ฟังก์ชันจาก A ไปทั่วถึง B"', c1: '$f : A \\xrightarrow{\\text{onto}} B$', c2: '$f : A \\to B$', c3: '$f : A \\xrightarrow{1-1} B$', c4: '$f : B \\to A$', ans: '$f : A \\xrightarrow{\\text{onto}} B$', reason: 'สัญลักษณ์มาตรฐานมักเขียนคำว่า onto กำกับไว้บนลูกศรเพื่อแยกแยะออกจากฟังก์ชันธรรมดา' },
        { q: 'กำหนด $f : \\mathbb{R} \\to \\mathbb{R}$ โดยที่ $f(x) = x^2$ ฟังก์ชันนี้เป็นฟังก์ชันทั่วถึงหรือไม่', c1: 'ไม่เป็นฟังก์ชันทั่วถึงเพราะเรนจ์ไม่มีจำนวนเต็มลบ', c2: 'เป็นฟังก์ชันทั่วถึงเพราะครอบคลุมจำนวนจริง', c3: 'ไม่เป็นฟังก์ชัน', c4: 'เป็นฟังก์ชันทั่วถึงเฉพาะค่าบวก', ans: 'ไม่เป็นฟังก์ชันทั่วถึงเพราะเรนจ์ไม่มีจำนวนเต็มลบ', reason: 'เซตปลายทางคือ $\\mathbb{R}$ แต่เรนจ์ที่แท้จริงคือ $[0, \\infty)$ ทำให้ไม่มีทางจับคู่กับจำนวนจริงลบได้ครบ' },
        { q: 'กำหนดให้ $f : \\mathbb{R} \\to [0, \\infty)$ โดยที่ $f(x) = |x|$ ฟังก์ชันนี้เป็นฟังก์ชันทั่วถึงหรือไม่', c1: 'เป็นฟังก์ชันทั่วถึง', c2: 'ไม่เป็นฟังก์ชันทั่วถึง', c3: 'ไม่เป็นฟังก์ชัน', c4: 'เป็นฟังก์ชันหนึ่งต่อหนึ่ง', ans: 'เป็นฟังก์ชันทั่วถึง', reason: 'เนื่องจากเรนจ์ของ $|x|$ คือ $[0, \\infty)$ ซึ่งเท่ากับโคโดเมนที่กำหนดมาให้ปลายทางพอดี สมาชิกจึงถูกใช้ครบ' },
        { q: 'ข้อใดกล่าวถูกต้องเกี่ยวกับฟังก์ชัน $f : A \\to B$ ที่ "ไม่ทั่วถึง"', c1: 'มีสมาชิกในเซต $B$ บางตัวที่ไม่ถูกจับคู่เลย', c2: 'มีสมาชิกในเซต $A$ บางตัวจับคู่ซ้ำ', c3: 'โดเมนเล็กกว่าเรนจ์', c4: 'เป็นเซตว่าง', ans: 'มีสมาชิกในเซต $B$ บางตัวที่ไม่ถูกจับคู่เลย', reason: 'ฟังก์ชันไม่ทั่วถึง (Into Function) หมายความว่าเรนจ์ใช้สมาชิกของเซตปลายทางไม่หมด เหลือเศษที่ไม่มีใครคู่ด้วย' },
        { q: 'ฟังก์ชันเชิงเส้น $f(x) = 2x + 3$ ที่มีข้อกำหนด $f : \\mathbb{R} \\to \\mathbb{R}$ มีคุณสมบัติอย่างไร', c1: 'เป็นทั้งฟังก์ชัน 1-1 และทั่วถึง', c2: 'เป็นฟังก์ชัน 1-1 แต่ไม่ทั่วถึง', c3: 'เป็นฟังก์ชันทั่วถึง แต่ไม่เป็น 1-1', c4: 'ไม่เป็นทั้งสองประเภท', ans: 'เป็นทั้งฟังก์ชัน 1-1 และทั่วถึง', reason: 'กราฟเส้นตรงทอดแนวยาวคลุมแกน X และแกน Y ทั้งหมดอย่างสมบูรณ์แบบจับคู่ตัวต่อตัว' },
        { q: 'ฟังก์ชัน $f : \\mathbb{R} \\to \\mathbb{R}$ รูปแบบ $f(x) = 5$ จัดเป็นฟังก์ชันทั่วถึงหรือไม่', c1: 'ไม่เป็นฟังก์ชันทั่วถึง', c2: 'เป็นฟังก์ชันทั่วถึง', c3: 'เป็นฟังก์ชันทั่วถึงเมื่อเปลี่ยนเป็นจำนวนเต็ม', c4: 'ข้อมูลไม่เพียงพอ', ans: 'ไม่เป็นฟังก์ชันทั่วถึง', reason: 'เรนจ์มีสมาชิกแค่ตัวเดียวคือเซต $\\s{5}$ แต่เซตปลายทางคือจำนวนจริงทั้งหมด $\\mathbb{R}$ จึงเหลือจำนวนอื่นๆ อีกนับไม่ถ้วน' },
        { q: 'ถ้าต้องการเปลี่ยนฟังก์ชันที่ไม่ทั่วถึงให้กลายเป็นทั่วถึง เราต้องแก้ไขส่วนใด', c1: 'ลดขนาดเซตปลายทาง (โคโดเมน) ให้เท่ากับเซตเรนจ์', c2: 'ขยายโดเมนให้ใหญ่ขึ้น', c3: 'เปลี่ยนสูตรสมการพหุนาม', c4: 'สลับที่คู่อันดับหน้าหลัง', ans: 'ลดขนาดเซตปลายทาง (โคโดเมน) ให้เท่ากับเซตเรนจ์', reason: 'ตีกรอบเซตปลายทางให้แคบลงจนเหลือเฉพาะค่าที่เรนจ์วิ่งไปถึง จะทำให้ฟังก์ชันนั้นกลายเป็นทั่วถึงทันที' },
        { q: 'กำหนด $f(x) = x^3$ โดยที่ $f : \\mathbb{R} \\to \\mathbb{R}$ ฟังก์ชันนี้ทั่วถึงหรือไม่', c1: 'เป็นฟังก์ชันทั่วถึง', c2: 'ไม่เป็นฟังก์ชันทั่วถึง', c3: 'ไม่เป็นฟังก์ชัน', c4: 'เป็นฟังก์ชันคงตัว', ans: 'เป็นฟังก์ชันทั่วถึง', reason: 'ฟังก์ชันกำลังสามสามารถให้ผลลัพธ์เป็นได้ทั้งค่าบวก ค่าลบ และศูนย์ ครอบคลุมจำนวนจริงทั้งหมด' },
        { q: 'กำหนดให้ $A = \\{a, b, c\\}$ ฟังก์ชันเอกลักษณ์ $I(x) = x$ บนเซต $A$ จัดเป็นฟังก์ชันประเภทใด', c1: 'เป็นฟังก์ชัน 1-1 และทั่วถึง', c2: 'ไม่ทั่วถึง', c3: 'ไม่เป็นฟังก์ชัน 1-1', c4: 'เป็นฟังก์ชันคงตัว', ans: 'เป็นฟังก์ชัน 1-1 และทั่วถึง', reason: 'ฟังก์ชันเอกลักษณ์ส่งสมาชิกไปหาตัวเอง คู่อันดับคือ $\\{(a,a),(b,b),(c,c)\\}$ ซึ่งจับคู่ครบและไม่ซ้ำ' },
        { q: 'ฟังก์ชันในข้อใดต่อไปนี้ "ไม่เป็น" ฟังก์ชันทั่วถึงจาก $\\mathbb{R}$ ไปยัง $\\mathbb{R}$', c1: '$f(x) = \\sin(x)$', c2: '$f(x) = x$', c3: '$f(x) = -x + 4$', c4: '$f(x) = 2x^3$', ans: '$f(x) = \\sin(x)$', reason: 'เนื่องจากเรนจ์ของฟังก์ชันไซน์ถูกจำกัดอยู่แค่ช่วง $[-1, 1]$ ไม่สามารถกระจายคลุมจำนวนจริง $\\mathbb{R}$ ทั้งหมดได้' },
        { q: 'กำหนด $f(x) = \\sqrt{x}$ โดยกำหนด $f : [0, \\infty) \\to [0, \\infty)$ ฟังก์ชันนี้เป็นฟังก์ชันทั่วถึงหรือไม่', c1: 'เป็นฟังก์ชันทั่วถึง', c2: 'ไม่เป็นฟังก์ชันทั่วถึง', c3: 'หาค่าโดเมนไม่ได้', c4: 'ไม่เป็นฟังก์ชัน 1-1', ans: 'เป็นฟังก์ชันทั่วถึง', reason: 'โดเมนและเรนจ์ของรากที่สองตรงกับขอบเขต $[0, \\infty)$ ที่ระบุไว้พอดี' },
        { q: 'พิจารณากราฟเส้นโค้ง $y = e^x$ บนข้อกำหนด $f : \\mathbb{R} \\to (0, \\infty)$ กราฟนี้มีลักษณะอย่างไร', c1: 'เป็นฟังก์ชัน 1-1 และทั่วถึง', c2: 'ไม่เป็นฟังก์ชัน 1-1 แต่ทั่วถึง', c3: 'เป็นฟังก์ชัน 1-1 แต่ไม่ทั่วถึง', c4: 'ไม่เป็นฟังก์ชัน', ans: 'เป็นฟังก์ชัน 1-1 และทั่วถึง', reason: 'เนื่องจากขอบเขตปลายทางถูกตั้งไว้ที่ $(0, \\infty)$ ซึ่งตรงกับเรนจ์ของฟังก์ชันเอกซ์โพเนนเชียลพอดี' },
        { q: 'ข้อใดสรุปได้ถูกต้องเกี่ยวกับฟังก์ชัน 1-1 และทั่วถึง (Bijection)', c1: 'สามารถสร้างฟังก์ชันผกผันที่สมบูรณ์แบบได้เสมอ', c2: 'โดเมนต้องเป็นเซตจำกัดเท่านั้น', c3: 'เรนจ์ต้องเป็นศูนย์', c4: 'กราฟต้องตัดจุดกำเนิดเสมอ', ans: 'สามารถสร้างฟังก์ชันผกผันที่สมบูรณ์แบบได้เสมอ', reason: 'คุณสมบัติ Bijection (1-1 และทั่วถึง) เป็นเงื่อนไขจำเป็นและเพียงพอที่จะทำให้มีอินเวอร์สเป็นฟังก์ชันได้ครบถ้วน' },

        // หมวด 6: ฟังก์ชันผกผัน / อินเวอร์ส (Inverse Function) (ข้อ 76-85)
        { q: 'จงหาฟังก์ชันผกผัน $f^{-1}(x)$ ของฟังก์ชันเชิงเส้น $f(x) = 3x - 4$', c1: '$f^{-1}(x) = \\frac{x+4}{3}$', c2: '$f^{-1}(x) = \\frac{x-4}{3}$', c3: '$f^{-1}(x) = 3x + 4$', c4: '$f^{-1}(x) = \\frac{x}{3} + 4$', ans: '$f^{-1}(x) = \\frac{x+4}{3}$', reason: 'จาก $y = 3x - 4 \\Rightarrow$ สลับตัวแปรได้ $x = 3y - 4 \\Rightarrow x + 4 = 3y \\Rightarrow y = \\frac{x+4}{3}$' },
        { q: 'ถ้ากำหนดให้ $f(2) = 5$ แล้วค่าของ $f^{-1}(5)$ จะมีค่าเท่ากับเลขใด', c1: '2', c2: '5', c3: '1/2', c4: '-2', ans: '2', reason: 'ตามคุณสมบัติการสะท้อนกลับของอินเวอร์ส ถ้าฟังก์ชันส่งจาก 2 ไป 5 อินเวอร์สย่อมส่งย้อนจาก 5 กลับมาหา 2' },
        { q: 'อินเวอร์สของความสัมพันธ์ $f = \\{(1,2), (3,4)\\}$ คือข้อใด', c1: '$f^{-1} = \\{(2,1), (4,3)\\}$', c2: '$f^{-1} = \\{(1,3), (2,4)\\}$', c3: '$f^{-1} = \\{(2,1), (3,4)\\}$', c4: '$f^{-1} = \\{(1,2), (4,3)\\}$', ans: '$f^{-1} = \\{(2,1), (4,3)\\}$', reason: 'การหาอินเวอร์สทำได้โดยการสลับตำแหน่งสมาชิกตัวหน้าและตัวหลังของทุกคู่อันดับในความสัมพันธ์นั้น' },
        { q: 'จงหาสูตรฟังก์ชันผกผันของ $f(x) = \\frac{x}{2} + 1$', c1: '$f^{-1}(x) = 2x - 2$', c2: '$f^{-1}(x) = 2x - 1$', c3: '$f^{-1}(x) = 2(x+1)$', c4: '$f^{-1}(x) = \\frac{2}{x-1}$', ans: '$f^{-1}(x) = 2x - 2$', reason: 'จาก $y = \\frac{x}{2} + 1 \\Rightarrow x = \\frac{y}{2} + 1 \\Rightarrow x - 1 = \\frac{y}{2} \\Rightarrow y = 2(x-1) = 2x - 2$' },
        { q: 'กราฟของฟังก์ชัน $f$ และกราฟของฟังก์ชันผกผัน $f^{-1}$ จะสมมาตรกันโดยสะท้อนข้ามเส้นตรงใด', c1: '$y = x$', c2: '$y = -x$', c3: 'แกน X', c4: 'แกน Y', ans: '$y = x$', reason: 'เนื่องจากการทำอินเวอร์สคือการสลับพิกัด $(x,y) \\leftrightarrow (y,x)$ กราฟจึงเป็นการพับสะท้อนข้ามเส้นตรงมุมฉาก $y=x$' },
        { q: 'จงหาฟังก์ชันผกผันของ $f(x) = x^3$', c1: '$f^{-1}(x) = \\sqrt[3]{x}$', c2: '$f^{-1}(x) = x^2$', c3: '$f^{-1}(x) = \\frac{1}{x^3}$', c4: '$f^{-1}(x) = 3x$', ans: '$f^{-1}(x) = \\sqrt[3]{x}$', reason: 'จาก $y = x^3 \\Rightarrow x = y^3 \\Rightarrow y = \\sqrt[3]{x}$' },
        { q: 'ถ้ากำหนด $f(x) = 2x + 1$ จงหาค่าของ $f^{-1}(7)$', c1: '3', c2: '15', c3: '2', c4: '4', ans: '3', reason: 'ตั้งสมการให้ผลลัพธ์ $2x + 1 = 7 \\Rightarrow 2x = 6 \\Rightarrow x = 3$ ดังนั้นอินเวอร์สของ 7 คือ 3' },
        { q: 'ข้อใดจัดเป็นเงื่อนไขสำคัญที่ทำให้ความสัมพันธ์อินเวอร์ส $f^{-1}$ เป็นฟังก์ชัน', c1: '$f$ ต้องเป็นฟังก์ชันหนึ่งต่อหนึ่ง (1-1)', c2: '$f$ ต้องเป็นฟังก์ชันคู่', c3: '$f$ ต้องมีโดเมนเป็นจำนวนจริงบวกเท่านั้น', c4: '$f$ ต้องเป็นฟังก์ชันคงตัว', ans: '$f$ ต้องเป็นฟังก์ชันหนึ่งต่อหนึ่ง (1-1)', reason: 'หากฟังก์ชันเดิมไม่เป็น 1-1 (มีตัวหลังซ้ำ) เมื่อพลิกกลับด้าน ตัวหน้าของอินเวอร์สจะซ้ำและส่งผลให้ไม่เป็นฟังก์ชัน' },
        { q: 'จงหาฟังก์ชันผกผันของ $f(x) = 1 - 2x$', c1: '$f^{-1}(x) = \\frac{1-x}{2}$', c2: '$f^{-1}(x) = \\frac{x-1}{2}$', c3: '$f^{-1}(x) = 2x - 1$', c4: '$f^{-1}(x) = 1 + 2x$', ans: '$f^{-1}(x) = \\frac{1-x}{2}$', reason: 'จาก $y = 1 - 2x \\Rightarrow x = 1 - 2y \\Rightarrow 2y = 1 - x \\Rightarrow y = \\frac{1-x}{2}$' },
        { q: 'กำหนดให้ $f(x) = \\sqrt[5]{x+2}$ จงหาสูตรอินเวอร์ส $f^{-1}(x)$', c1: '$f^{-1}(x) = x^5 - 2$', c2: '$f^{-1}(x) = x^5 + 2$', c3: '$f^{-1}(x) = (x-2)^5$', c4: '$f^{-1}(x) = \\frac{1}{x^5+2}$', ans: '$f^{-1}(x) = x^5 - 2$', reason: 'จาก $y = \\sqrt[5]{x+2} \\Rightarrow x = \\sqrt[5]{y+2} \\Rightarrow x^5 = y + 2 \\Rightarrow y = x^5 - 2$' },

        // หมวด 7: ฟังก์ชันคอมโพสิท (Composite Function) (ข้อ 86-100)
        { q: 'กำหนดให้ $f(x) = x + 2$ และ $g(x) = 3x$ จงหาสูตรของ $(g \\circ f)(x)$', c1: '$3x + 6$', c2: '$3x + 2$', c3: '$3x + 3$', c4: '$x + 5$', ans: '$3x + 6$', reason: 'จาก $(g \\circ f)(x) = g(f(x)) = g(x+2) = 3(x+2) = 3x + 6$' },
        { q: 'จากข้อ 86 จงหาสูตรของ $(f \\circ g)(x)$', c1: '$3x + 2$', c2: '$3x + 6$', c3: '$3x - 2$', c4: '$6x + 2$', ans: '$3x + 2$', reason: 'จาก $(f \\circ g)(x) = f(g(x)) = f(3x) = 3x + 2$' },
        { q: 'การดำเนินกระบวนการฟังก์ชันคอมโพสิท มีสมบัติการสลับที่หรือไม่ (นั่นคือ $(g \\circ f)(x) = (f \\circ g)(x)$ เสมอหรือไม่)', c1: 'ไม่มีสมบัติการสลับที่โดยทั่วไป', c2: 'มีสมบัติการสลับที่เสมอ', c3: 'มีสมบัติการสลับที่เฉพาะกราฟวงกลม', c4: 'มีสมบัติการสลับที่เมื่อชันเท่ากัน', ans: 'ไม่มีสมบัติการสลับที่โดยทั่วไป', reason: 'การจัดรูปฟังก์ชันชั้นในและชั้นนอกที่ต่างลำดับกันมักจะให้โครงสร้างพหุนามผลลัพธ์ที่ต่างกันอย่างชัดเจน' },
        { q: 'กำหนด $f(x) = x^2$ และ $g(x) = x - 3$ จงหาค่าของ $(f \\circ g)(5)$', c1: '4', c2: '22', c3: '25', c4: '16', ans: '4', reason: 'หาชั้นในก่อนได้ $g(5) = 5 - 3 = 2$ จากนั้นส่งทอดไปฟังก์ชันหลักข้างนอกจะได้ $f(2) = 2^2 = 4$' },
        { q: 'จากข้อ 89 จงหาค่าของ $(g \\circ f)(5)$', c1: '22', c2: '4', c3: '10', c4: '2', ans: '22', reason: 'หาชั้นในก่อนได้ $f(5) = 5^2 = 25$ จากนั้นส่งทอดไปฟังก์ชันนอกต่อได้ $g(25) = 25 - 3 = 22$' },
        { q: 'เงื่อนไขสำคัญทางคณิตศาสตร์ที่จะทำให้สามารถหาฟังก์ชันคอมโพสิท $g \\circ f$ ได้คือข้อใด', c1: '$R_f \\cap D_g \\neq \\varnothing$', c2: '$D_f \\cap R_g \\neq \\varnothing$', c3: '$R_f = D_g$', c4: '$R_f \\subset D_g$', ans: '$R_f \\cap D_g \\neq \\varnothing$', reason: 'เรนจ์ของฟังก์ชันตัวแรก ($f$) และโดเมนของฟังก์ชันตัวถัดไป ($g$) ต้องมีสมาชิกร่วมกันอย่างน้อยหนึ่งตัวจึงจะส่งค่าต่อได้' },
        { q: 'กำหนดให้ $f(x) = 2x$ จงหาฟังก์ชันคอมโพสิทที่ซ้อนตัวเองคือ $(f \\circ f)(x)$', c1: '$4x$', c2: '$2x^2$', c3: '$4x^2$', c4: '$x$', ans: '$4x$', reason: 'จาก $(f \\circ f)(x) = f(f(x)) = f(2x) = 2(2x) = 4x$' },
        { q: 'ถ้ากำหนด $f(x) = x + 1$ และ $(g \\circ f)(x) = 2x + 5$ จงหาสูตรของ $g(x)$', c1: '$2x + 3$', c2: '$2x + 4$', c3: '$2x + 5$', c4: '$2x + 2$', ans: '$2x + 3$', reason: 'สมมติให้ $t = x + 1 \\Rightarrow x = t - 1$ แทนในคอมโพสิทจะได้ $g(t) = 2(t-1) + 5 = 2t - 2 + 5 = 2t + 3$ ดังนั้น $g(x) = 2x + 3$' },
        { q: 'กำหนดให้ $f = \\{(1,3), (2,4)\\}$ และ $g = \\{(3,5), (4,6)\\}$ จงหาคู่อันดับของ $g \\circ f$', c1: '$\\{(1,5), (2,6)\\}$', c2: '$\\{(3,1), (4,2)\\}$', c3: '$\\{(1,6), (2,5)\\}$', c4: '$\\{(5,1), (6,2)\\}$', ans: '$\\{(1,5), (2,6)\\}$', reason: 'ส่งทอดตามพิกัด: $x=1 \\to f(1)=3 \\to g(3)=5$ ได้ $(1,5)$ และ $x=2 \\to f(2)=4 \\to g(4)=6$ ได้ $(2,6)$' },
        { q: 'ข้อใดคือค่าของ $(f \\circ f^{-1})(x)$ ตามคุณสมบัติทั่วไปของฟังก์ชันอินเวอร์ส', c1: '$x$ (ฟังก์ชันเอกลักษณ์)', c2: '$f(x)$', c3: '$x^2$', c4: '1', ans: '$x$ (ฟังก์ชันเอกลักษณ์)', reason: 'ฟังก์ชันและฟังก์ชันผกผันของมันจะดำเนินการหักล้างกันเอง ส่งผลให้ตัวแปรต้นกลับคืนสู่ค่าเดิมเสมือนไม่ได้ทำอะไร' },
        { q: 'กำหนดให้ $f(x) = -x$ และ $g(x) = |x|$ จงหาค่าของ $(g \\circ f)(-7)$', c1: '7', c2: '-7', c3: '0', c4: '14', ans: '7', reason: 'คำนวณชั้นใน $f(-7) = -(-7) = 7$ จากนั้นแทนในฟังก์ชันนอกต่อได้ $g(7) = |7| = 7$' },
        { q: 'กำหนดให้ $f(x) = 4x - 1$ จงหาค่าของ $(f^{-1} \\circ f)(100)$', c1: '100', c2: '399', c3: '0', c4: '401', ans: '100', reason: 'เนื่องจาก $f^{-1} \\circ f$ ย่อมตัดกันหมดไปตามนิยามคู่สะท้อนกลับ ผลลัพธ์จึงได้เท่ากับตัวแปรเริ่มต้นทันทีโดยไม่ต้องคำนวณแยก' },
        { q: 'ถ้า $f(x) = x+3$ และ $g(x) = x^2$ จงหาโดเมนของ $(g \\circ f)(x)$ หากทั้งคู่มีโดเมนเป็นจำนวนจริง', c1: '$\\mathbb{R}$', c2: '$[0, \\infty)$', c3: '$[3, \\infty)$', c4: '$\\mathbb{R} - \\{-3\\}$', ans: '$\\mathbb{R}$', reason: 'เนื่องจากไม่มีข้อห้ามเรื่องเศษส่วนหรือติดลบในเครื่องหมายราก โดเมนของผลลัพธ์พหุนามคอมโพสิทจึงคงไว้ซึ่งจำนวนจริงทั้งหมด' },
        { q: 'กำหนดให้ $f(x) = 2x + 3$ จงหาค่าของ $(f \\circ f)(-1)$', c1: '5', c2: '1', c3: '3', c4: '-1', ans: '5', reason: 'คำนวณชั้นในก่อน: $f(-1) = 2(-1) + 3 = 1$ จากนั้นนำเลข 1 ไปคำนวณซ้ำรอบนอก: $f(1) = 2(1) + 3 = 5$' },
        { q: 'กำหนด $f(x) = x^2 - 1$ และ $g(x) = \\sqrt{x}$ จงหาสูตรพหุนามทั่วไปของ $(f \\circ g)(x)$ บนขอบเขตค่าบวก', c1: '$x - 1$', c2: '$x^2 - 1$', c3: '$\\sqrt{x^2-1}$', c4: '$x + 1$', ans: '$x - 1$', reason: 'แทนค่าตามลำดับนิยาม จะได้ $f(g(x)) = f(\\sqrt{x}) = (\\sqrt{x})^2 - 1 = x - 1$' }
    ];

    // ฟังก์ชันในการสุ่มโจทย์รอบละ 10 ข้อ
    function generateQuiz() {
        const container = document.getElementById('quiz-container');
        const scoreBoard = document.getElementById('score-board');
        
        container.innerHTML = '';
        scoreBoard.style.display = 'none';
        
        // สลับตำแหน่งโจทย์ทั้งหมดในคลังและดึงออกมา 10 ข้อ
        const shuffled = [...itemBank].sort(() => 0.5 - Math.random());
        const selectedQuestions = shuffled.slice(0, 10);
        
        selectedQuestions.forEach((item, index) => {
            const qNum = index + 1;
            // รวมตัวเลือกและสลับตำแหน่งตัวเลือกเพื่อความโปร่งใส
            const choices = [item.c1, item.c2, item.c3, item.c4].sort(() => 0.5 - Math.random());
            let choicesHtml = '';
            
            choices.forEach(choice => {
                choicesHtml += `
                    <label>
                        <input type="radio" name="q${qNum}" value="${choice}"> ${choice}
                    </label>
                `;
            });

            const qHtml = `
                <div class="quiz-item-box" data-answer="${item.ans}" data-reason="${item.reason}">
                    <p class="quiz-question-text">ข้อที่ ${qNum}: ${item.q}</p>
                    <div class="options-container">
                        ${choicesHtml}
                    </div>
                    <div class="feedback-box"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', qHtml);
        });

        // สั่งให้ MathJax ประมวลผลสัญลักษณ์คณิตศาสตร์รอบใหม่
        if (window.MathJax && window.MathJax.typeset) {
            window.MathJax.typeset();
        }
    }

    // ฟังก์ชันตรวจคำตอบและคิดคะแนน
    function checkAnswers() {
        const items = document.querySelectorAll('.quiz-item-box');
        let score = 0;
        let allAnswered = true;

        // ตรวจสอบความครบถ้วนก่อนส่ง
        items.forEach((item, index) => {
            const qNum = index + 1;
            const selected = document.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) allAnswered = false;
        });

        if (!allAnswered) {
            alert('กรุณาวิเคราะห์และเลือกคำตอบให้ครบถ้วนทั้ง 10 ข้อก่อนกดส่งตรวจครับ');
            return;
        }

        // เฉลยละเอียดรายข้อ
        items.forEach((item, index) => {
            const qNum = index + 1;
            const selectedValue = document.querySelector(`input[name="q${qNum}"]:checked`).value;
            const correctAnswer = item.getAttribute('data-answer');
            const reason = item.getAttribute('data-reason');
            const feedbackDiv = item.querySelector('.feedback-box');
            
            feedbackDiv.style.display = 'block';
            
            if (selectedValue === correctAnswer) {
                score++;
                feedbackDiv.style.backgroundColor = '#e8f5e9';
                feedbackDiv.style.color = '#2e7d32';
                feedbackDiv.style.borderColor = '#c8e6c9';
                feedbackDiv.innerHTML = `<strong>ถูกต้องครับ</strong> — ${reason}`;
            } else {
                feedbackDiv.style.backgroundColor = '#ffebee';
                feedbackDiv.style.color = '#c62828';
                feedbackDiv.style.borderColor = '#ffcdd2';
                feedbackDiv.innerHTML = `<strong>ยังไม่ถูกครับ</strong> (คำตอบที่ถูกต้องคือ: ${correctAnswer}) — ${reason}`;
            }
        });

        // แสดงแผงรวมคะแนนด้านล่าง
        const scoreBoard = document.getElementById('score-board');
        scoreBoard.style.display = 'block';
        
        if (score === items.length) {
            scoreBoard.style.backgroundColor = '#e8f5e9';
            scoreBoard.style.color = '#2e7d32';
            scoreBoard.style.borderColor = '#c8e6c9';
            scoreBoard.innerHTML = `🎉 ยอดเยี่ยมระดับอัจฉริยะ! คุณทำคะแนนเต็มได้สำเร็จ ${score} / ${items.length} คะแนน สะท้อนความเชี่ยวชาญในบทเรียนนี้อย่างสมบูรณ์แบบครับ`;
        } else if (score >= 7) {
            scoreBoard.style.backgroundColor = '#e3f2fd';
            scoreBoard.style.color = '#1565c0';
            scoreBoard.style.borderColor = '#bbdefb';
            scoreBoard.innerHTML = `👍 เก่งมากครับ! คุณผ่านเกณฑ์ด้วยคะแนน ${score} / ${items.length} คะแนน ทบทวนจุดผิดพลาดเล็กๆ น้อยๆ แล้วลองสุ่มทำใหม่อีกครั้งเพื่อความแม่นยำนะครับ`;
        } else {
            scoreBoard.style.backgroundColor = '#fff3e0';
            scoreBoard.style.color = '#e65100';
            scoreBoard.borderColor = '#ffe0b2';
            scoreBoard.innerHTML = `💡 พยายามต่อไปครับ! คุณได้คะแนน ${score} / ${items.length} คะแนน อ่านคำอธิบายข้อที่ผิดพลาดด้านบน แล้วกดปุ่ม "เปลี่ยนชุดโจทย์สุ่มใหม่" เพื่อเพิ่มความจำและความเข้าใจให้ดียิ่งขึ้นได้เลย`;
        }

        if (window.MathJax && window.MathJax.typeset) {
            window.MathJax.typeset();
        }
    }

    // เริ่มต้นทำงานทันทีเมื่อโหลดหน้าเว็บสำเร็จ
    window.onload = generateQuiz;
    </script>
